# TEMPORARY: does `docker compose up` build an absent image when both
# `image:` and `build:` are set? That is the exact shape of this repo's
# compose file, and the "clone -> docker compose up" promise depends on it.
name: ci-clone-and-up

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/ci-clone-and-up.yml"

permissions:
  contents: write
  packages: read

jobs:
  compose-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Test
        shell: bash
        continue-on-error: true
        run: |
          R=ci-clone-and-up-report.md
          echo "# compose auto-build report ($(date -u +%FT%TZ))" > "$R"
          echo "" >> "$R"
          echo "## does 'compose up' build a missing image?" >> "$R"
          echo '```' >> "$R"
          mkdir -p /tmp/stub && cd /tmp/stub
          printf 'FROM busybox\nCMD ["sleep","300"]\n' > Dockerfile
          printf 'name: stubtest\nservices:\n  app:\n    image: stub-test:local\n    build: .\n' > docker-compose.yml
          echo "--- image absent before up:" >> "$R"
          docker image inspect stub-test:local >/dev/null 2>&1 && echo "PRESENT(unexpected)" >> "$R" || echo "ABSENT(expected)" >> "$R"
          echo "--- docker compose up -d (no prior docker build):" >> "$R"
          docker compose up -d >> "$R" 2>&1 && echo "UP_EXIT_0" >> "$R" || echo "UP_EXIT_NONZERO" >> "$R"
          if docker image inspect stub-test:local >/dev/null 2>&1; then
            echo "AUTOBUILD_OK: compose built the missing image itself" >> "$R"
            echo "::notice::AUTOBUILD_OK compose built the missing image"
          else
            echo "AUTOBUILD_FAILED: compose did NOT build it" >> "$R"
            echo "::notice::AUTOBUILD_FAILED compose did not build the image"
          fi
          echo "--- compose ps:" >> "$R"
          docker compose ps >> "$R" 2>&1
          echo '```' >> "$R"
          cd / && rm -rf /tmp/stub

      - name: Publish
        if: always()
        shell: bash
        run: |
          [ -f ci-clone-and-up-report.md ] || echo "no report" > ci-clone-and-up-report.md
          cat ci-clone-and-up-report.md
          git config user.name "arena-diagnostic[bot]"
          git config user.email "arena-diagnostic[bot]@users.noreply.github.com"
          git add ci-clone-and-up-report.md
          git commit -m "ci: compose auto-build report" || echo "nothing to commit"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
