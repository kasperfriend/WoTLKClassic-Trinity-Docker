# TEMPORARY diagnostic workflow.
# This sandbox has no Docker and cannot reach ghcr.io or read Actions log
# archives, so this workflow builds the image on a runner and commits the
# findings back as files the sandbox can read through the GitHub API.
name: ci-smoke-diagnose

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/ci-smoke-diagnose.yml"
      - "Dockerfile"

permissions:
  contents: write
  packages: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query GHCR
        shell: bash
        continue-on-error: true
        run: |
          R="ci-registry-report.md"
          echo "# GHCR registry report ($(date -u +%FT%TZ))" > "$R"
          TOK_JSON="$(curl -s -u "ignored:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?scope=repository:kasperfriend/wotlkclassic-trinity-docker:pull" || true)"
          TOK="$(printf '%s' "$TOK_JSON" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
          echo "- anonymous/token token obtained: $([ -n "$TOK" ] && echo yes || echo no)" >> "$R"
          for NAME in \
            kasperfriend/wotlkclassic-trinity-docker \
            kasperfriend/trinitycore-3.4.3 ; do
            echo "" >> "$R"
            echo "## $NAME" >> "$R"
            echo '```' >> "$R"
            curl -s -o /tmp/tags.json -w "tags/list HTTP %{http_code}\n" \
              ${TOK:+-H "Authorization: Bearer $TOK"} \
              "https://ghcr.io/v2/$NAME/tags/list" >> "$R" 2>&1
            cat /tmp/tags.json >> "$R" 2>/dev/null; echo >> "$R"
            for TAG in latest 2026.09.05; do
              curl -s -o /dev/null -w "  HEAD $NAME:$TAG -> HTTP %{http_code}\n" \
                ${TOK:+-H "Authorization: Bearer $TOK"} \
                -H "Accept: application/vnd.oci.image.index.v1+json" \
                "https://ghcr.io/v2/$NAME/manifests/$TAG" >> "$R" 2>&1
            done
            echo '```' >> "$R"
          done
          cat "$R"
      - name: Publish
        if: always()
        shell: bash
        run: |
          [ -f ci-registry-report.md ] || echo "no registry report" > ci-registry-report.md
          git config user.name  "arena-diagnostic[bot]"
          git config user.email "arena-diagnostic[bot]@users.noreply.github.com"
          git add ci-registry-report.md
          git commit -m "ci: registry report" || echo "nothing to commit"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"

  build:
    needs: registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the CURRENT (unfixed) Dockerfile from main
        shell: bash
        run: |
          git show origin/main:Dockerfile > Dockerfile.main 2>/dev/null || git show main:Dockerfile > Dockerfile.main
          echo "== building image exactly as a user would (Dockerfile from main) =="
          docker build -f Dockerfile.main -t unfixed:latest . 2>&1 | tail -40

      - name: Inspect the unfixed image
        shell: bash
        continue-on-error: true
        run: |
          R="ci-build-report.md"
          echo "# build report ($(date -u +%FT%TZ))" > "$R"
          echo "" >> "$R"
          echo "## A. unfixed image (Dockerfile from main): ldd" >> "$R"
          echo '```' >> "$R"
          docker run --rm --network none --entrypoint /bin/bash unfixed:latest -c '
            for b in /opt/tc/bin/*; do echo "--- $b"; ldd "$b" 2>&1 | grep -E "not found|mysql|mariadb|boost|ssl|readline"; done
            echo "=== mysql/mariadb sonames present in image ==="
            ldconfig -p | grep -iE "mysql|mariadb" || echo "(none)"
            echo "=== installed mysql/mariadb packages ==="
            dpkg -l | grep -iE "mysql|mariadb" || echo "(none)"
          ' >> "$R" 2>&1
          echo '```' >> "$R"
          echo "" >> "$R"
          echo "## B. unfixed image: the EXACT daily-rebuild link check" >> "$R"
          echo '```' >> "$R"
          if docker run --rm --network none --entrypoint /bin/bash unfixed:latest -c '
              set -e
              for b in /opt/tc/bin/*; do
                if ldd "$b" | grep -q "not found"; then
                  echo "MISSING LIBS in $b:"; ldd "$b" | grep "not found"; exit 1
                fi
              done
              echo "ALL_BINARIES_LINK_OK"'; then
            echo "LINKCHECK_PASS" >> "$R"
          else
            echo "LINKCHECK_FAIL  <-- this is what fails the daily-rebuild smoke test" >> "$R"
          fi
          echo '```' >> "$R"
          echo "" >> "$R"
          echo "## C. unfixed image: bnetserver banner check" >> "$R"
          OUT="$(docker run --rm --network none --entrypoint /opt/tc/bin/bnetserver unfixed:latest \
                 -c /opt/tc/etc/bnetserver.conf.dist 2>&1 | head -30)" || true
          echo '```' >> "$R"; echo "$OUT" >> "$R"; echo '```' >> "$R"
          echo "$OUT" | grep -qiE "bnetserver|TrinityCore" && echo "BANNER_PASS" >> "$R" || echo "BANNER_FAIL" >> "$R"
          cat "$R"

      - name: Publish part 1
        if: always()
        shell: bash
        run: |
          [ -f ci-build-report.md ] || echo "no build report" > ci-build-report.md
          git config user.name  "arena-diagnostic[bot]"
          git config user.email "arena-diagnostic[bot]@users.noreply.github.com"
          git add ci-build-report.md
          git commit -m "ci: build report (unfixed)" || echo "nothing to commit"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
