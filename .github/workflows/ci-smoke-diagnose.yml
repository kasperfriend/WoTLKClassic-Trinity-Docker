# TEMPORARY verification workflow — runs the EXACT smoke test that now ships in
# daily-rebuild.yml, plus the GHCR package-state query. This sandbox has no
# Docker and cannot reach ghcr.io, so results are committed back as a file.
name: ci-smoke-diagnose

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/ci-smoke-diagnose.yml"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/daily-rebuild.yml"

permissions:
  contents: write
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build
        shell: bash
        run: docker build -t trinitycore-3.4.3:local . 2>&1 | tail -20

      - name: Run the shipping smoke test verbatim
        shell: bash
        continue-on-error: true
        run: |
          R=ci-verify-report.md
          echo "# verification report ($(date -u +%FT%TZ))" > "$R"
          IMAGE="trinitycore-3.4.3:local"

          echo "" >> "$R"; echo "## 1. dynamic libraries" >> "$R"; echo '```' >> "$R"
          if docker run --rm --network none --entrypoint /bin/bash "$IMAGE" -c '
              set -e
              for b in /opt/tc/bin/*; do
                if ldd "$b" | grep -q "not found"; then
                  echo "MISSING LIBS in $b:"; ldd "$b" | grep "not found"; exit 1
                fi
              done
              echo "ALL_BINARIES_LINK_OK"' >> "$R" 2>&1; then
            echo "STEP1_PASS" >> "$R"
          else
            echo "STEP1_FAIL" >> "$R"
          fi
          echo '```' >> "$R"

          echo "" >> "$R"; echo "## 2. bnetserver --version (executes, loader OK)" >> "$R"
          OUT="$(docker run --rm --network none --entrypoint /opt/tc/bin/bnetserver "$IMAGE" --version 2>&1)" || true
          echo '```' >> "$R"; echo "$OUT" | tr -d '\000' >> "$R"; echo '```' >> "$R"
          if echo "$OUT" | grep -qE "error while loading shared libraries|cannot open shared object file"; then
            echo "STEP2_FAIL (loader error)" >> "$R"
          elif echo "$OUT" | grep -q "rev\."; then
            echo "STEP2_PASS" >> "$R"
          else
            echo "STEP2_FAIL (no version string)" >> "$R"
          fi

          echo "" >> "$R"; echo "## 3. live stack: MySQL + bnetserver via docker-compose" >> "$R"
          echo '```' >> "$R"
          AUTO_DOWNLOAD_DB=false SERVER_IMAGE="$IMAGE" \
            docker compose up -d --no-build mysql bnetserver >> "$R" 2>&1 \
            && echo "COMPOSE_UP_OK" >> "$R" || echo "COMPOSE_UP_FAILED" >> "$R"
          H=missing
          for _ in $(seq 1 36); do
            H="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' wow343-bnetserver-1 2>/dev/null || echo missing)"
            echo "  bnetserver health: $H" >> "$R"
            [ "$H" = healthy ] && break
            sleep 5
          done
          echo "--- last 25 log lines (NULs stripped, banner art removed)" >> "$R"
          docker logs --tail 25 wow343-bnetserver-1 2>&1 | tr -d '\000' | grep -av '^[ /\\_]*$' >> "$R" 2>&1 || true
          echo "--- port 1119 reachable from the runner host" >> "$R"
          (exec 3<>/dev/tcp/127.0.0.1/1119) 2>/dev/null && echo "PORT_1119_OPEN" >> "$R" || echo "PORT_1119_CLOSED" >> "$R"
          echo "--- auth.realmlist row written by the entrypoint" >> "$R"
          docker compose exec -T mysql mysql -uroot -pwow -N -e 'SELECT CONCAT("realmlist: ",id," ",name," ",address,":",port) FROM auth.realmlist;' >> "$R" 2>&1
          [ "$H" = healthy ] && echo "STEP3_PASS" >> "$R" || echo "STEP3_FAIL" >> "$R"
          echo '```' >> "$R"
          docker compose down -v >/dev/null 2>&1 || true

      - name: GHCR package state
        shell: bash
        continue-on-error: true
        run: |
          R=ci-verify-report.md
          echo "" >> "$R"; echo "## 4. GHCR package state" >> "$R"; echo '```' >> "$R"
          echo "- GET /users/kasperfriend/packages?package_type=container  (GITHUB_TOKEN)" >> "$R"
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/kasperfriend/packages?package_type=container" >> "$R" 2>&1
          echo "" >> "$R"
          echo "- GET /users/kasperfriend/packages/container/wotlkclassic-trinity-docker" >> "$R"
          curl -s -o /tmp/p.json -w "  HTTP %{http_code}\n" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/users/kasperfriend/packages/container/wotlkclassic-trinity-docker" >> "$R" 2>&1
          head -c 300 /tmp/p.json >> "$R" 2>/dev/null; echo >> "$R"
          echo "- ghcr.io/v2/.../tags/list (anonymous)" >> "$R"
          curl -s -o /tmp/t.json -w "  HTTP %{http_code}\n" \
            "https://ghcr.io/v2/kasperfriend/wotlkclassic-trinity-docker/tags/list" >> "$R" 2>&1
          head -c 300 /tmp/t.json >> "$R" 2>/dev/null; echo >> "$R"
          echo '```' >> "$R"

      - name: Publish report
        if: always()
        shell: bash
        run: |
          [ -f ci-verify-report.md ] || echo "no report produced" > ci-verify-report.md
          tr -d '\000' < ci-verify-report.md > /tmp/r && mv /tmp/r ci-verify-report.md
          echo "=== REPORT ==="; cat ci-verify-report.md
          git config user.name  "arena-diagnostic[bot]"
          git config user.email "arena-diagnostic[bot]@users.noreply.github.com"
          git add ci-verify-report.md
          git commit -m "ci: verification report" || echo "nothing to commit"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
