# TEMPORARY: is worldserver stable, and what exactly stops it with no client data?
name: ci-freshclone

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/ci-freshclone.yml"

permissions:
  contents: write
  packages: read

jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run
        shell: bash
        continue-on-error: true
        run: |
          set +e
          R="$GITHUB_WORKSPACE/ci-fresh-report.md"
          echo "# worldserver stability report ($(date -u +%FT%TZ))" > "$R"
          rm -rf "$HOME/srv"
          git clone -q -b "$GITHUB_REF_NAME" --depth 1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$HOME/srv" >> "$R" 2>&1
          cd "$HOME/srv"
          cp .env.example .env

          echo "" >> "$R"; echo "## 1. up" >> "$R"; echo '```' >> "$R"
          timeout 2400 docker compose up -d >> "$R" 2>&1
          echo "  up exit=$?" >> "$R"
          echo '```' >> "$R"

          echo "" >> "$R"; echo "## 2. worldserver over 10 minutes" >> "$R"; echo '```' >> "$R"
          for i in $(seq 1 20); do
            RC="$(docker inspect --format '{{.RestartCount}}' wow343-worldserver-1 2>/dev/null || echo '?')"
            S="$(docker inspect --format '{{.State.Status}} exit={{.State.ExitCode}}' wow343-worldserver-1 2>/dev/null || echo missing)"
            BH="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' wow343-bnetserver-1 2>/dev/null || echo missing)"
            echo "  t=$((i*30))s worldserver[$S] restarts=$RC bnetserver=$BH" >> "$R"
            sleep 30
          done
          echo '```' >> "$R"

          echo "" >> "$R"; echo "## 3. worldserver: how far did it get?" >> "$R"; echo '```' >> "$R"
          echo "--- milestones reached:" >> "$R"
          docker logs wow343-worldserver-1 2>&1 | tr -d '\000' \
            | grep -aE "Using configuration file|Updating .* database|is up-to-date|Realm running|Using World DB|Initialize|Loading|World initialized|Map|dbc|DBC|Gameobject|Creature|Starting" \
            | sort -u | head -40 >> "$R" 2>&1
          echo "--- data / map / dbc related lines:" >> "$R"
          docker logs wow343-worldserver-1 2>&1 | tr -d '\000' \
            | grep -aiE "data|maps|vmaps|mmaps|dbc|not exist|cannot|failed|error|fatal|unable|missing" \
            | grep -avE "Missing name|SQLDriver|database at" | sort -u | head -30 >> "$R" 2>&1
          echo "--- last 20 lines:" >> "$R"
          docker logs --tail 20 wow343-worldserver-1 2>&1 | tr -d '\000' | grep -av '^[ /\\_]*$' >> "$R" 2>&1
          echo '```' >> "$R"

          echo "" >> "$R"; echo "## 4. final state" >> "$R"; echo '```' >> "$R"
          docker compose ps >> "$R" 2>&1
          docker compose exec -T mysql mysql -uroot -pwow -N -e \
            'SELECT table_schema, COUNT(*) FROM information_schema.tables WHERE table_schema IN ("auth","characters","world","hotfixes") GROUP BY table_schema;' >> "$R" 2>&1
          echo "  import ERROR lines: $(docker logs wow343-worldserver-1 2>&1 | grep -ac '^ERROR')" >> "$R"
          echo "--- ports actually listening:" >> "$R"
          for p in 1119 8081 8085; do
            (exec 3<>/dev/tcp/127.0.0.1/$p) 2>/dev/null && echo "  $p OPEN" >> "$R" || echo "  $p closed" >> "$R"
          done
          echo '```' >> "$R"
          docker compose down -v >> /dev/null 2>&1

      - name: Publish
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          [ -f ci-fresh-report.md ] || echo "no report" > ci-fresh-report.md
          git config user.name "arena-diagnostic[bot]"
          git config user.email "arena-diagnostic[bot]@users.noreply.github.com"
          git add ci-fresh-report.md
          git commit -m "ci: worldserver stability report" || echo "nothing to commit"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
