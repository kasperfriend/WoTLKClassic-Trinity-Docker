# TEMPORARY: verifies ./etc config seeding + edit persistence.
name: ci-etc-mount

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/ci-etc-mount.yml"
      - "runtime/entrypoint.sh"
      - "docker-compose.yml"

permissions:
  contents: write
  packages: read

jobs:
  etc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build
        shell: bash
        run: docker build -t trinitycore-3.4.3:local . 2>&1 | tail -12

      - name: Test the ./etc mount
        shell: bash
        continue-on-error: true
        run: |
          set +e
          R="$GITHUB_WORKSPACE/ci-etc-report.md"
          echo "# ./etc config-mount report ($(date -u +%FT%TZ))" > "$R"
          export SERVER_IMAGE=trinitycore-3.4.3:local AUTO_DOWNLOAD_DB=false

          echo "" >> "$R"; echo "## 1. bnetserver: conf seeded on first up" >> "$R"; echo '```' >> "$R"
          ls -la etc >> "$R" 2>&1 || echo "(./etc does not exist yet - expected)" >> "$R"
          docker compose up -d --no-build mysql bnetserver >> "$R" 2>&1
          H=missing
          for _ in $(seq 1 30); do
            H="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' wow343-bnetserver-1 2>/dev/null || echo missing)"
            [ "$H" = healthy ] && break
            sleep 5
          done
          echo "  bnetserver health: $H" >> "$R"
          echo "--- host ./etc after first up:" >> "$R"; ls -la etc >> "$R" 2>&1
          echo "--- effective settings in ./etc/bnetserver.conf:" >> "$R"
          grep -E "^(LoginDatabaseInfo|LogsDir|CertificatesFile|PrivateKeyFile|LoginREST\.Port|BattlenetPort)" etc/bnetserver.conf >> "$R" 2>&1
          echo '```' >> "$R"

          echo "" >> "$R"; echo "## 2. user edits persist; DB line is re-applied" >> "$R"; echo '```' >> "$R"
          # three host-side edits: a real setting, a marker, and a deliberately
          # corrupted DB line that the entrypoint must put right on next boot.
          sed -i 's/^LoginREST\.Port *=.*/LoginREST.Port = 9999/' etc/bnetserver.conf
          echo "# ARENA_USER_EDIT_MARKER" >> etc/bnetserver.conf
          sed -i 's|^LoginDatabaseInfo *=.*|LoginDatabaseInfo = "bogus;1;bad;bad;auth"|' etc/bnetserver.conf
          echo "--- before restart:" >> "$R"
          grep -nE "^LoginREST\.Port|ARENA_USER_EDIT_MARKER|^LoginDatabaseInfo" etc/bnetserver.conf >> "$R" 2>&1

          docker compose restart bnetserver >> "$R" 2>&1
          H=missing
          for _ in $(seq 1 30); do
            H="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' wow343-bnetserver-1 2>/dev/null || echo missing)"
            [ "$H" = healthy ] && break
            sleep 5
          done
          echo "  bnetserver health after restart: $H" >> "$R"
          echo "--- after restart:" >> "$R"
          grep -nE "^LoginREST\.Port|ARENA_USER_EDIT_MARKER|^LoginDatabaseInfo" etc/bnetserver.conf >> "$R" 2>&1

          grep -q "ARENA_USER_EDIT_MARKER" etc/bnetserver.conf && echo "MARKER_PERSISTED" >> "$R" || echo "MARKER_LOST" >> "$R"
          grep -q "^LoginREST.Port = 9999" etc/bnetserver.conf && echo "SETTING_PERSISTED" >> "$R" || echo "SETTING_LOST" >> "$R"
          grep -q '^LoginDatabaseInfo = "mysql;3306;root;wow;auth"' etc/bnetserver.conf && echo "DBLINE_REAPPLIED" >> "$R" || echo "DBLINE_NOT_FIXED" >> "$R"
          grep -q "bogus" etc/bnetserver.conf && echo "DBLINE_STILL_BOGUS" >> "$R" || echo "DBLINE_CLEAN" >> "$R"
          echo '```' >> "$R"
          docker compose down -v >> "$R" 2>&1

          echo "" >> "$R"; echo "## 3. worldserver: conf seeded" >> "$R"; echo '```' >> "$R"
          rm -rf etc logs
          mkdir -p import/world
          echo "CREATE TABLE IF NOT EXISTS arena_marker (id INT);" > import/world/zz_arena_marker.sql
          docker compose up -d --no-build mysql worldserver >> "$R" 2>&1
          for _ in $(seq 1 36); do
            [ -f etc/worldserver.conf ] && break
            sleep 5
          done
          echo "--- host ./etc:" >> "$R"; ls -la etc >> "$R" 2>&1
          echo "--- effective settings in ./etc/worldserver.conf:" >> "$R"
          grep -E "^(LoginDatabaseInfo|WorldDatabaseInfo|CharacterDatabaseInfo|HotfixDatabaseInfo|DataDir|LogsDir|SourceDirectory)" etc/worldserver.conf >> "$R" 2>&1
          [ -f etc/worldserver.conf ] && echo "WORLDSERVER_CONF_SEEDED" >> "$R" || echo "WORLDSERVER_CONF_MISSING" >> "$R"
          echo "--- last 15 worldserver log lines:" >> "$R"
          docker logs --tail 15 wow343-worldserver-1 2>&1 | tr -d '\000' >> "$R" 2>&1
          echo '```' >> "$R"
          docker compose down -v >/dev/null 2>&1
          rm -f import/world/zz_arena_marker.sql

      - name: Publish
        if: always()
        shell: bash
        run: |
          [ -f ci-etc-report.md ] || echo "no report" > ci-etc-report.md
          cat ci-etc-report.md
          git config user.name "arena-diagnostic[bot]"
          git config user.email "arena-diagnostic[bot]@users.noreply.github.com"
          git add ci-etc-report.md
          git commit -m "ci: etc-mount report" || echo "nothing to commit"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
