# ============================================================================
#  Daily rebuild — every day at 06:00 Europe/Kiev
#
#  GitHub cron runs in UTC. Ukraine is EEST (UTC+3) in summer and EET
#  (UTC+2) in winter, so a single cron entry would drift by an hour across
#  DST changes. We register BOTH possible UTC times (03:00 and 04:00) and a
#  guard step skips any run whose local Kyiv hour is not 06 — that way the
#  build always fires at exactly 06:00 Europe/Kiev, all year round.
#
#  The job resolves the LATEST commit of xHashii/3.4.3_Source, builds the
#  Docker image from it and pushes to GHCR:
#      ghcr.io/<owner>/<repo>:latest
#      ghcr.io/<owner>/<repo>:YYYY.MM.DD
#      ghcr.io/<owner>/<repo>:sha-<upstream-short-sha>
#
#  Runs can also be triggered manually (Actions → Daily rebuild → Run).
# ============================================================================
name: daily-rebuild

on:
  schedule:
    - cron: "0 3 * * *"   # 06:00 Europe/Kiev while EEST (UTC+3) is in effect
    - cron: "0 4 * * *"   # 06:00 Europe/Kiev while EET  (UTC+2) is in effect
  workflow_dispatch:        # manual "Run workflow" button
  push:                     # also rebuild when the packaging itself changes
    branches: [main]
    paths:
      - "Dockerfile"
      - "runtime/**"
      - ".github/workflows/daily-rebuild.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: daily-rebuild
  cancel-in-progress: false

env:
  UPSTREAM_REPO: "https://github.com/xHashii/3.4.3_Source.git"
  UPSTREAM_BRANCH: "main"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # DST guard: only continue if it is really 06:00 in Kyiv right now.
      # Manual (workflow_dispatch) and push runs always continue.
      # ------------------------------------------------------------------
      - name: DST guard (only run at 06:00 Europe/Kiev)
        id: guard
        run: |
          HOUR="$(TZ=Europe/Kiev date +%H)"
          echo "Kyiv local hour: $HOUR"
          if [ "$HOUR" != "06" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Not 06:00 in Kyiv — scheduled run skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------------
      # Resolve the newest upstream commit and prepare image tags
      # ------------------------------------------------------------------
      - name: Resolve latest upstream commit
        if: steps.guard.outputs.skip != 'true'
        id: upstream
        run: |
          SHA="$(git ls-remote "$UPSTREAM_REPO" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Upstream HEAD: $SHA"

      - name: Compute image name and tags
        if: steps.guard.outputs.skip != 'true'
        id: img
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          DATE_TAG="$(TZ=Europe/Kiev date +%Y.%m.%d)"
          {
            echo "image=$IMAGE"
            echo "tags<<TAGS"
            echo "$IMAGE:latest"
            echo "$IMAGE:$DATE_TAG"
            echo "$IMAGE:sha-${{ steps.upstream.outputs.short }}"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE (latest, $DATE_TAG, sha-${{ steps.upstream.outputs.short }})"

      # ------------------------------------------------------------------
      # Build & push
      # ------------------------------------------------------------------
      - name: Set up Docker Buildx
        if: steps.guard.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.guard.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.tags }}
          build-args: |
            SOURCE_REPO=${{ env.UPSTREAM_REPO }}
            SOURCE_BRANCH=${{ env.UPSTREAM_BRANCH }}
            SOURCE_SHA=${{ steps.upstream.outputs.sha }}
            CACHEBUST=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # Smoke test the freshly built image
      # ------------------------------------------------------------------
      - name: Smoke test (link check + banner)
        if: steps.guard.outputs.skip != 'true'
        run: |
          IMAGE="${{ steps.img.outputs.image }}:latest"
          echo "== checking dynamic libraries =="
          docker run --rm --network none --entrypoint /bin/bash "$IMAGE" -c '
            set -e
            for b in /opt/tc/bin/*; do
              if ldd "$b" | grep -q "not found"; then
                echo "MISSING LIBS in $b:"; ldd "$b" | grep "not found"; exit 1
              fi
            done
            echo "ALL_BINARIES_LINK_OK"'
          echo "== checking binaries run (no DB, must print banner) =="
          OUT="$(docker run --rm --network none \
                  --entrypoint /opt/tc/bin/bnetserver "$IMAGE" \
                  -c /opt/tc/etc/bnetserver.conf.dist 2>&1 | head -40)" || true
          echo "$OUT"
          echo "$OUT" | grep -qiE "bnetserver|TrinityCore" \
            || { echo "bnetserver did not print its banner"; exit 1; }
          echo "SMOKE_OK"

      # ------------------------------------------------------------------
      # Summary
      # ------------------------------------------------------------------
      - name: Job summary
        if: steps.guard.outputs.skip != 'true'
        run: |
          {
            echo "## ✅ Daily rebuild complete"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Upstream | [$UPSTREAM_REPO](https://github.com/xHashii/3.4.3_Source) |"
            echo "| Commit | [\`${{ steps.upstream.outputs.short }}\`](https://github.com/xHashii/3.4.3_Source/commit/${{ steps.upstream.outputs.sha }}) |"
            echo "| Image | \`${{ steps.img.outputs.image }}:latest\` |"
            echo "| Dated tag | \`${{ steps.img.outputs.image }}:$(TZ=Europe/Kiev date +%Y.%m.%d)\` |"
            echo ""
            echo "Pull with:"
            echo '```bash'
            echo "docker pull ${{ steps.img.outputs.image }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
