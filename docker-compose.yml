# ============================================================================
#  TrinityCore 3.4.3 (WotLK Classic) — full stack
#    mysql       : MySQL 8.0 (native-password mode, required by the core)
#    bnetserver  : logon server        -> ports 1119 (bnet) + 8081 (REST)
#    worldserver : game server         -> port 8085
#
#  Workflow (once):
#    1. docker compose up -d          builds, starts, creates + imports the
#                                     DBs (10–30 min), and drops the
#                                     extractors into the repo root
#    2. ./extract-data.sh <client>    extract client data (Windows: .bat)
#    3. ./data                        where the extracted folders land
#                                     (dbc maps vmaps mmaps gt cameras)
#    4. docker compose restart worldserver     (or: docker compose restart)
#
#  Afterwards: docker compose up -d starts everything in seconds.
#  Watch the first boot with: docker compose logs -f worldserver
#
#  The server image is LOCAL-ONLY by default (trinitycore-3.4.3:local) — it
#  exists nowhere on a registry, it only exists once this repo has built it.
#  That is why the three services below set `pull_policy: never`: without it
#  Compose asks Docker Hub for that name first and you get
#      pull access denied for trinitycore-3.4.3, repository does not exist
#      or may require 'docker login'
#  (fatal on Compose older than ~v2.24, merely scary on newer ones). Nothing to
#  do about it normally; if you ever wonder whether this folder is ready, run
#  ./doctor.sh — it checks the image, the data, the launchers and the ports.
# ============================================================================
name: wow343

services:
  mysql:
    image: mysql:8.0
    command:
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=1G
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wow}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  bnetserver:
    # Default: a LOCAL image name, so `docker compose up` always builds from
    # this repo and never depends on a registry you may not have access to.
    # To pull the CI build instead, set BOTH lines in .env (the workflow
    # publishes ghcr.io/<owner>/<repo-in-lowercase>):
    #   SERVER_IMAGE=ghcr.io/kasperfriend/wotlkclassic-trinity-docker:latest
    #   SERVER_PULL_POLICY=always
    # (that package must be Public, or the host must `docker login ghcr.io`)
    image: ${SERVER_IMAGE:-trinitycore-3.4.3:local}
    # Built from this repo when the image is missing locally; never looked up
    # in a registry (see the header). SERVER_PULL_POLICY overrides this for a
    # registry-hosted SERVER_IMAGE: always = refresh from GHCR on every up,
    # missing = pull only when it isn't cached yet.
    build: .
    pull_policy: ${SERVER_PULL_POLICY:-never}
    command: ["bnetserver"]
    environment: &dbenv
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wow}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wow}
      AUTO_DOWNLOAD_DB: ${AUTO_DOWNLOAD_DB:-true}
      REALM_NAME: ${REALM_NAME:-TrinityCore 3.4.3}
      REALM_ADDRESS: ${REALM_ADDRESS:-127.0.0.1}
      TZ: ${TZ:-Europe/Kiev}
    ports:
      - "1119:1119"   # battle.net logon protocol
      - "8081:8081"   # login REST service
    volumes: &vol
      - ./data:/opt/tc/data     # dbc / maps / vmaps / mmaps (client data)
      - ./logs:/opt/tc/logs     # server log files
      - ./import:/opt/tc/import # drop *.sql dumps into ./import/world
      - ./etc:/opt/tc/conf      # worldserver.conf / bnetserver.conf — editable
    depends_on:
      mysql:
        condition: service_healthy
    stdin_open: true   # keep console attachable: docker attach wow343-bnetserver-1
    tty: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  worldserver:
    image: ${SERVER_IMAGE:-trinitycore-3.4.3:local}
    build: .
    pull_policy: ${SERVER_PULL_POLICY:-never}
    command: ["worldserver"]
    environment: *dbenv
    ports:
      - "8085:8085"
    volumes: *vol
    depends_on:
      mysql:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: unless-stopped
    stop_grace_period: 60s   # worldserver saves character/world state on shutdown
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45m   # first boot imports the whole world DB

  # --------------------------------------------------------------------------
  # One-shot: copies the extractor tools out of the image into the repo root
  # (./tools) and generates ./extract-data.sh + ./extract-data.bat, so users
  # get working extractors from `docker compose up -d` without touching Docker
  # again. Exits immediately; `up -d` does not wait for it.
  # --------------------------------------------------------------------------
  extractors:
    image: ${SERVER_IMAGE:-trinitycore-3.4.3:local}
    build: .
    pull_policy: ${SERVER_PULL_POLICY:-never}
    entrypoint: ["/usr/local/bin/export-tools.sh"]
    environment:
      EXPORT_DIR: /export
      # Baked into the generated launchers so they drive the same image.
      SERVER_IMAGE_REF: ${SERVER_IMAGE:-trinitycore-3.4.3:local}
    volumes:
      # The repo root itself — this is what lets the service write
      # ./tools, ./extract-data.sh and ./extract-data.bat next to this file.
      - .:/export
    restart: "no"

volumes:
  mysql-data:
